[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-desk"
version = "0.1.0"
description = "Scoped media-permission change enforcement across Airtable, Notion, and Trello."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "python-dotenv",
    "anthropic",
    "fastapi",
    "uvicorn",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default excludes FULL CORE tests registered with marker `full`.
# Equivalent: python -m pytest -m "not full"
addopts = "-m 'not full'"
markers = [
    "full: FULL CORE tests; excluded by default via -m 'not full'",
]
